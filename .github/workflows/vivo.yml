# Artes "ao vivo" do perfil: monitor (cooler + números + sites), gravura das
# contribuições e a cobra do arcade. Tudo vai para o ramo `output`, que o README lê.
name: Artes ao vivo

on:
  schedule:
    - cron: '17 */3 * * *'   # a cada 3 horas
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vivo
  cancel-in-progress: true

jobs:
  vivo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Ferramentas
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q fonttools brotli

      - name: Monitor e gravura das contribuições
        run: .venv/bin/python .github/scripts/live.py dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}

      - name: Cobra do arcade (come as contribuições)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/cobra.svg?color_snake=#e3060c&color_dots=#efe9df,#d8d5cf,#a9a59e,#6a6865,#0b0b0d
            dist/cobra-escura.svg?color_snake=#fdfcf9&color_dots=#161b22,#4a0d10,#7d0a0e,#b5070c,#e3060c

      - name: Publicar no ramo output
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "artes ao vivo $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
